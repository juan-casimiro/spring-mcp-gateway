name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-report:
    name: quality-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Determine head commit SHA
        id: head
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # actions/checkout defaults to GITHUB_SHA, which on pull_request events
      # is GitHub's synthetic refs/pull/N/merge commit (head merged onto the
      # base branch's *current* tip), not the PR branch's own commit. That
      # would silently measure a different tree than the SHA recorded below
      # in metadata.json/the artifact name, and would conflate the PR's own
      # changes with whatever has landed on main since the PR's base was set.
      # Pin explicitly to the real head commit so what's measured always
      # matches what's labeled.
      - name: Check out head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate head quality snapshot
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pquality clean verify
          mkdir -p target/quality
          cp target/site/jacoco/jacoco.xml target/quality/jacoco.xml
          cp target/pmd.xml target/quality/pmd.xml
          python3 quality/summarize.py target/quality "${{ steps.head.outputs.sha }}"

      # Reuse a previously published main-branch baseline for this PR's exact
      # base commit when one exists. If it does not (never published, or the
      # artifact has expired), fall back to measuring that base commit fresh
      # in the next two steps rather than silently comparing against nothing
      # or an unrelated later baseline.
      - name: Look up base-commit baseline artifact
        id: baseline_lookup
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/quality.yml/runs?event=push&status=success&head_sha=${BASE_SHA}&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            --jq ".artifacts[] | select(.name==\"quality-baseline-${BASE_SHA}\") | .id")
          if [ -z "$artifact_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p base-snapshot
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" -o baseline.zip
          unzip -q baseline.zip -d base-snapshot
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check out base commit (fallback when no cached baseline)
        if: github.event_name == 'pull_request' && steps.baseline_lookup.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-checkout

      - name: Generate base quality snapshot (fallback)
        if: github.event_name == 'pull_request' && steps.baseline_lookup.outputs.found != 'true'
        working-directory: base-checkout
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pquality clean verify
          mkdir -p target/quality
          cp target/site/jacoco/jacoco.xml target/quality/jacoco.xml
          cp target/pmd.xml target/quality/pmd.xml
          python3 quality/summarize.py target/quality "${{ github.event.pull_request.base.sha }}"
          mkdir -p ../base-snapshot
          cp target/quality/coverage.csv target/quality/hotspots.csv target/quality/complexity.csv \
            target/quality/metadata.json ../base-snapshot/

      - name: Compare against base commit
        if: github.event_name == 'pull_request'
        run: python3 quality/compare_baseline.py target/quality base-snapshot > target/quality/comparison.json

      - name: Render job summary
        if: github.event_name == 'pull_request'
        run: python3 quality/render_summary.py target/quality/comparison.json >> "$GITHUB_STEP_SUMMARY"

      - name: Emit warning annotations
        if: github.event_name == 'pull_request'
        run: |
          jq -r '.warnings[]' target/quality/comparison.json | while IFS= read -r warning; do
            echo "::warning::${warning}"
          done

      - name: Upload full quality reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ steps.head.outputs.sha }}
          path: |
            target/site/jacoco/
            target/reports/pmd.html
            target/quality/
          retention-days: 7

      # Compact, commit-identified baseline for subsequent PRs' base-commit
      # comparisons. Only CSVs + metadata, not the raw XML/HTML, to keep this
      # artifact small; kept much longer than the full reports above so a
      # PR's base commit usually has a reusable baseline instead of needing
      # the fresh-measurement fallback above.
      - name: Publish compact baseline (main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-baseline-${{ github.sha }}
          path: |
            target/quality/coverage.csv
            target/quality/hotspots.csv
            target/quality/complexity.csv
            target/quality/metadata.json
          retention-days: 90
