name: Publish

# Publish is deliberately its own workflow file, triggered only by `push`.
# A fork's pull_request cannot generate a push event against this repo, so
# the publish path is unreachable from a fork by construction, not because
# of an `if:` guard that a future edit could weaken or remove.
#
# No concurrency group: every push to main gets its own publish run.
# A shared group would cancel pending runs queued behind an in-progress one
# (true even with cancel-in-progress: false), silently dropping images for
# some main commits.
on:
  push:
    branches: [main]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is scoped to this run and expires when it ends, so
          # no long-lived registry credential sits in repository secrets.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once and kept local: the image that is smoke-tested below is
      # the exact image pushed afterwards, never a second build of it.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          # Same scope as ci.yml's build. The cache is only an optimization:
          # the build must succeed with it empty.
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build

      # Proves the image starts and reports healthy with its default
      # configuration and no RAG service running. Does not prove MCP
      # behaviour, RAG connectivity, or live LLM calls. A failure exits this
      # job before any push step runs.
      - name: Smoke-test the image (starts and becomes healthy)
        run: scripts/smoke-test-image.sh ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
