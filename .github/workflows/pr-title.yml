name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title matches Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._-]+\))?!?: .+[^.]$'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits format: type(scope): description"
            echo "Expected pattern: $pattern"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
